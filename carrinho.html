<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chama Coral - Meu Carrinho</title>
    
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/css/carrinho.css">
    <link rel="stylesheet" href="assets/icons.css"> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>
    <header id="header" class="scroll"></header>

    <main>
        <div class="cart-page-container">
            <header>
                <h2 class="title">Meu Carrinho</h2>
            </header>

            <div id="cart-items-display" class="cart-items">
                <p style="text-align: center; padding: 2rem;">Carregando seu carrinho...</p>
            </div>

            <div id="cart-summary" class="cart-summary">
                Total: <span id="cart-total">R$ 0,00</span>
            </div>

            <button id="checkout-button" class="checkout-btn" disabled>Finalizar Compra</button>
            <a href="partituras.html" class="back-to-shop">Continuar Comprando Partituras</a>
        </div>
    </main>

    <footer class="section"></footer>

    <a href="#" class="back-to-top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' }); return false;"><i class="ri-arrow-up-line"></i></a>

    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">×</span>
            <h2 class="modal-title">Formas de Pagamento</h2>
            <div id="payment-options-content">
                </div>
        </div>
    </div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="assets/js/fibase-config.js"></script>
    
    <script src="assets/js/cart-logic.js"></script>
    <script src="assets/js/layout.js" defer></script>
    
    <script src="assets/js/carrinho-page.js"></script>
    
    </body>
    </html>

</body>
</html>
