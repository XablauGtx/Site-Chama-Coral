<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chama Coral - Admin de Produtos</title>
    <link rel="stylesheet" href="assets/css/ad.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Admin de Produtos</h1>
        <button id="logout-btn">Sair</button>
    </header>

    <main class="container">
        <section id="auth-section">
            <h2>Login de Administrador</h2>
            <form id="login-form">
                <label for="email">Email:</label>
                <input type="email" id="email" required><br><br>
                <label for="password">Senha:</label>
                <input type="password" id="password" required><br><br>
                <button type="submit">Entrar</button>
                <p id="login-error-message" style="color: red;"></p>
            </form>
        </section>

        <section id="admin-content" style="display: none;">
            <h2>Gerenciar Produtos</h2>

            <h3>Adicionar/Editar Produto</h3>
            <form id="partitura-form">
                <input type="hidden" id="partitura-id">

                <label for="tipo">Tipo de Produto:</label>
                <select id="tipo" required>
                    <option value="partitura">Partitura</option>
                    <option value="moda">Moda</option>
                </select><br><br>

                <label for="titulo">Título:</label>
                <input type="text" id="titulo" required><br><br>
                
                <div id="campos-partitura">
                    <label for="compositor">Compositor (Opcional):</label>
                    <input type="text" id="compositor"><br><br>

                    <label for="instrumento">Instrumento (Opcional):</label>
                    <input type="text" id="instrumento"><br><br>

                    <label for="genero">Gênero (Opcional):</label>
                    <input type="text" id="genero"><br><br>
                </div>
                
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" rows="3" required></textarea><br><br>
                
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" required><br><br>
                
                <label for="imagem_capa_url">URL da Imagem de Capa:</label>
                <input type="url" id="imagem_capa_url" required><br><br>
                
                <button type="submit" id="save-partitura-btn">Adicionar Produto</button>
                <button type="button" id="cancel-edit-btn" style="display: none;">Cancelar Edição</button>
            </form>
            <p id="form-message" style="color: green;"></p>

            <hr>

            <h3>Produtos Cadastrados</h3>
            <table id="partituras-table">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="assets/js/fibase-config.js"></script>
    <script src="assets/js/ad.js"></script> 
</body>
</html>
