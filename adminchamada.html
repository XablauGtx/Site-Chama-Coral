<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Relatório de Chamada</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

    <header>
        <h1>
            <a href="index.html"> <img src="assets/img/LOGO CHAMA.png" alt="Logo" width="55px"></a>
        </h1>
        <nav>
            <a href="Chamada.html">Chamada</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main>
        <div class="card" id="login-card">
            <h2>Acesso Administrador</h2>
            <input type="email" id="email-admin" placeholder="E-mail do administrador">
            <input type="password" id="senha-admin" placeholder="Senha do administrador">
            <button id="btn-login-admin">Entrar</button>
            <p id="auth-error-message" style="color: red; margin-top: 10px;"></p>
        </div>

        <div class="card" id="relatorio-data-selector" style="display: none;">
            <h2>Buscar Relatório por Data</h2>
            <label for="dataRelatorio">Selecione uma data:</label>
            <input type="date" id="dataRelatorio">
            <button id="btnCarregarRelatorio">Carregar Relatório</button>
            <button id="btn-logout" style="margin-top: 20px;">Sair</button>
        </div>

        <div class="card" id="relatorio-completo" style="display: none;">
            <h2>Ensaios do Chama Coral <span id="data-ensaio"></span></h2>

            <div class="estatisticas">
                <p>Total de Participantes: <span id="total-participantes">0</span></p>
                <p class="soprano">Soprano: <span id="soprano-count">0</span> participantes</p>
                <p class="contralto">Contralto: <span id="contralto-count">0</span> participantes</p>
                <p class="tenor">Tenor: <span id="tenor-count">0</span> participantes</p>
                <p class="baixo">Baixo: <span id="baixo-count">0</span> participantes</p>
            </div>

            <h3>Lista de Participantes</h3>
            <div id="lista-participantes-admin">
                <div class="participante-admin-header">
                    <div class="col-nome">Nome</div>
                    <div class="col-naipe">Naipe</div>
                    <div class="col-registro">Hora</div>
                    <div class="col-novo-coralista">Novo?</div>
                    <div class="col-telefone">Telefone</div> </div>
                </div>

            <button id="btnExportarCSV">Exportar CSV</button>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
