<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chama Coral - Partituras</title>
    <link rel="stylesheet" href="assets/css/style.css"> 
    <link rel="stylesheet" href="assets/css/partituras.css">
    <link rel="stylesheet" href="assets/style.css"> 
    <link rel="stylesheet" href="assets/icons.css"> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
</head>
<body>

    <div id="add-to-cart-popup" class="add-to-cart-popup">
        <span id="popup-message"></span>
    </div>
    
    <header id="header" class="scroll"></header>

    <main>
        <section class="section" id="services">
            <div class="container">
                <header>
                    <h2 class="title">PARTITURAS</h2>
                    <p class="subtitle">
                        Explore nossa coleção de partituras e encontre a melodia perfeita para o seu coral.
                    </p>
                    <div class="search-filter">
                        <input type="text" id="sheet-music-search" placeholder="Pesquisar partituras por nome...">
                        <button id="search-button">Buscar</button>
                    </div>
                </header>
                <div class="partituras-list grid">
                    <p>Carregando partituras...</p>
                </div>
            </div>
        </section>
        <div class="divider-1"></div>
    </main>

    <footer class="section"></footer>

    <a href="#home" class="back-to-top"><i class="icon-arrow-up"></i></a>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="assets/js/fibase-config.js"></script>
    <script src="assets/js/layout.js" defer></script>
    <script src="assets/js/cart-logic.js"></script>
    <script src="assets/js/partituras-cart.js"></script> 

</body>
</html>
